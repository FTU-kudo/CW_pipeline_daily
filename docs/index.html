<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Bảng giá chứng quyền — phân tích định lượng.">
  <title>CW Board — Quant Analysis</title>
  <style>
    /* Bảng màu do ui.css quản lý qua html[data-theme]; ở đây chỉ giữ biến dự phòng. */
    :root{color-scheme:dark;--bg:#0b1118;--panel:#121c27;--line:#263646;--text:#e6edf5;--muted:#93a4b6;--accent:#43d3a0;--warn:#f3c969;--panel-2:#172330;--line-soft:#1e2b39;--accent-soft:rgba(67,211,160,.12);--up:#43d3a0;--down:#ff8a7a;--track:#0e1620}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{max-width:1500px;margin:auto;padding:24px}header{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
    h1{font-size:24px;margin:0 0 4px}.sub,.muted{color:var(--muted)}.stamp{white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums}
    .toolbar{display:flex;gap:10px;align-items:center;margin:16px 0}.toolbar input{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px}
    button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}
    .summary{color:var(--muted);margin-left:auto}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
    /* min-width từng là 1200px cho MỌI bảng — đó là lý do bảng giá 22 cột buộc phải cuộn
       ngang. Bảng giá nay còn 12 cột nên bỏ chặn này; riêng bảng xếp hạng vẫn cần
       min-width:1180px (14 cột, khai báo ở .rank-table trong ui.css). */
    table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:var(--th-bg);color:var(--th-text);font-weight:600;z-index:1}
    th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}th:first-child{z-index:2;background:var(--th-bg)}td:first-child{font-weight:700;color:var(--accent)}
    tr:hover td{background:var(--row-hover)}td:first-child a{color:var(--accent);text-decoration:none}details{text-align:left;white-space:normal;min-width:150px}summary{cursor:pointer;color:#a9c8df}pre{max-width:460px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#091019;padding:10px;border-radius:6px;color:#d7e2ed;font-size:12px}
    #state{padding:26px;text-align:center;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
    .stat .k{color:var(--muted);font-size:12px}.stat .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
    .stat .n{color:var(--muted);font-size:12px;margin-top:2px}
    td.num{font-variant-numeric:tabular-nums}.idle{color:var(--warn)}
    .negative{color:#ff8a7a}.positive{color:var(--accent)}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
    .tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px}
    .tab:hover{color:var(--text);border-color:var(--line)}
    .tab.active{background:var(--panel);border-color:var(--accent);color:var(--text);font-weight:600}
    .view{margin-top:4px}.view h2{font-size:16px;margin:18px 0 8px}.view h3{font-size:14px;margin:14px 0 6px;color:#b7c7d7}
    .view table{min-width:520px}.view .table-wrap{margin-bottom:16px}
    .caption{color:var(--muted);font-size:12px;margin:4px 0 10px}
    .bars{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
    .bar{display:grid;grid-template-columns:120px 1fr 104px;gap:10px;align-items:center;font-size:12px}
    /* Nền rãnh dùng --track: theme tối #0e1620, theme sáng #e2e8f0. Viết cứng mã màu tối ở
       đây từng làm thanh thành một khối đen trên nền trắng. */
    .bar .track{background:var(--track);border:1px solid var(--line);border-radius:6px;height:16px;overflow:hidden}
    /* display:block là bắt buộc: <span> là inline nên `width` vô hiệu, và mọi thanh sẽ dài
       bằng nhau — biểu đồ khi đó vẽ sai số liệu chứ không chỉ xấu. */
    .bar .fill{display:block;height:100%;background:linear-gradient(90deg,#2b8a6b,var(--accent))}
    .bar .val{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
    .spark{display:block;width:100%;height:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
    .empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
    .flag{color:var(--warn)}footer{margin-top:18px;font-size:12px;color:var(--muted)}@media(max-width:700px){main{padding:14px}h1{font-size:20px}.toolbar{flex-wrap:wrap}.summary{width:100%;margin:0}}
  </style>
  <script>
    // Set a pre-render hint so a deep-linked tab never flashes the default board on reload.
    const bootTab = new URLSearchParams(window.location.search).get('tab');
    if (bootTab !== null) document.documentElement.dataset.bootTab = bootTab;
  </script>
  <!-- Inter cho chữ; fallback hệ thống nên trang vẫn đúng nếu không tải được webfont.
       `display=swap` để chữ hiện ngay bằng font hệ thống rồi đổi sang Inter, không bị trắng chữ. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/ui.css">
  <link rel="stylesheet" href="assets/katex/katex.min.css">
</head>
<body>
<main>
  <!-- Header một hàng: tiêu đề + MỘT câu thời gian bên trái; công tắc giao diện, ngôn ngữ
       và đồng hồ thời gian thực dồn sang phải. Trước đây khối này chiếm bốn dòng dọc vì
       mỗi dòng thời gian ("cập nhật lúc", "phiên") đứng riêng và các công tắc có nhãn trên. -->
  <header class="app-header">
    <div class="topbar">
      <div class="topbar-left">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V5M8 19V9M13 19V4M18 19v-7M2 19h20"/><path d="m4 8 4-3 5 2 6-4"/></svg></span>
        <div class="brand-copy">
          <h1><span>Covered Warrants</span><span class="brand-divider">/</span><span class="product-badge">Quant Analysis</span></h1>
          <p class="brand-meta" id="sub-line"><svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8.1 8.1 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-.9L3 20l.9-4.5a8.4 8.4 0 0 1-.9-4A8.1 8.1 0 0 1 11.5 3h.5a8.1 8.1 0 0 1 8 8v.5Z"/><path d="M12 7v5l3 2"/></svg><span id="sub-line-text">Cập nhật: —</span></p>
          <p class="brand-meta muted-line" id="freshness" hidden><span id="stamp">Đang đọc snapshot…</span></p>
        </div>
      </div>
      <div class="controls">
        <div class="control-cluster utility-cluster" aria-label="Điều hướng phụ">
          <button type="button" class="btn-ghost top-action" data-view="history" aria-pressed="false" title="Lịch sử"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span class="t-txt">Lịch sử</span></button>
          <button type="button" class="btn-ghost top-action" data-view="glossary" aria-pressed="false" title="Giải thích thuật ngữ"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg><span class="t-txt">Giải thích thuật ngữ</span></button>
        </div>
        <span class="control-divider" aria-hidden="true"></span>
        <div class="control-cluster preference-cluster">
          <div class="seg lang-seg" role="group" aria-label="Ngôn ngữ">
            <button type="button" data-lang-set="vi" aria-pressed="true" title="Tiếng Việt">VI</button>
            <button type="button" data-lang-set="en" aria-pressed="false" title="English">EN</button>
          </div>
          <div class="seg theme-seg" role="group" aria-label="Giao diện sáng hoặc tối">
            <button type="button" data-theme-set="light" aria-pressed="false"><svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span>Sáng</span></button>
            <button type="button" data-theme-set="dark" aria-pressed="false"><svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg><span>Tối</span></button>
          </div>
        </div>
        <span class="control-divider status-divider" aria-hidden="true"></span>
        <div class="clock market-pill" id="market-clock" data-session="closed" aria-live="off">
          <span class="dot" aria-hidden="true"></span>
          <time id="clock-time">--:--:--</time>
          <span class="cmeta">
            <span class="cdate" id="clock-date"></span>
            <span class="csession" id="clock-session"></span>
          </span>
        </div>
      </div>
    </div>
  </header>
  <!-- Bảng thống kê mô tả toàn thị trường CW: cái đầu tiên người xem thấy. Chỉ số nào không
       tính được từ dữ liệu đang có thì KHÔNG hiện (xem renderOverview) — thà thiếu còn hơn
       hiện số 0 giả. -->
  <section class="overview" id="overview" hidden>
    <h2 class="ov-title"><span class="ov-title-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><span class="t-txt">Toàn cảnh thị trường chứng quyền</span><span class="ov-title-rule" aria-hidden="true"></span></h2>
    <div class="ov-grid" id="ov-grid"></div>
  </section>
  <!-- Năm tab đầu là các mục chính người xem quan tâm nhất → tô nổi (class `feature`).
       Emoji đứng trước nhãn để quét bằng mắt nhanh hơn đọc chữ. -->
  <!-- Ba nhóm điều hướng tách bạch thay vì mười tab ngang hàng:
       1. chuyển chế độ xem chính, 2. tuỳ chọn hiển thị (chip nhỏ), 3. hai nút phụ có viền
       đẩy sang phải. Trước đây cả mười mục cùng kích thước nên người dùng không phân biệt
       được đâu là chuyển trang, đâu là tuỳ chọn. -->
  <nav class="nav-block" id="tabs" aria-label="Điều hướng chế độ xem">
    <div class="nav-group view-group" role="tablist" aria-label="Chế độ xem">
      <span class="nav-group-label">Xem</span>
      <button type="button" class="tab active" data-view="board" role="tab" aria-selected="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg><span class="t-txt">Bảng giá</span></button>
      <button type="button" class="tab" data-view="scoring" role="tab" aria-selected="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><span class="t-txt">Xếp hạng</span></button>
      <button type="button" class="tab" data-view="valuation" role="tab" aria-selected="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/></svg><span class="t-txt">Định giá</span></button>
      <button type="button" class="tab" data-view="liquidity" role="tab" aria-selected="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg><span class="t-txt">Thanh khoản</span></button>
      <button type="button" class="tab" data-view="underlyings" role="tab" aria-selected="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h18"/><path d="M6 18v-7"/><path d="M10 18v-7"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="m12 2 8 5H4Z"/></svg><span class="t-txt">Theo cơ sở</span></button>
    </div>

    <span class="nav-divider" aria-hidden="true"></span>

    <div class="nav-group nav-options" role="group" aria-label="Tuỳ chọn hiển thị">
      <span class="nav-group-label">Tuỳ chọn</span>
      <button type="button" class="tab chip" data-view="stale" role="tab" aria-selected="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg><span class="t-txt">Mã không giao dịch</span></button>
      <button type="button" class="tab chip" data-view="intraday" role="tab" aria-selected="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="t-txt">Trong phiên</span></button>
      <button type="button" class="tab chip" data-view="band" role="tab" aria-selected="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span class="t-txt">Trần–sàn</span></button>
    </div>

  </nav>
  <section class="view" id="view-scoring" hidden></section>
  <section class="view" id="view-valuation" hidden></section>
  <section class="view" id="view-liquidity" hidden></section>
  <section class="view" id="view-underlyings" hidden></section>
  <section class="view" id="view-stale" hidden></section>
  <section class="view" id="view-intraday" hidden></section>
  <section class="view" id="view-band" hidden></section>
  <section class="view" id="view-history" hidden></section>
  <section class="view" id="view-glossary" hidden></section>
  <section class="view" id="view-board">
  <p class="caption" id="click-hint">Bấm một mã ở cột đầu để xem toàn bộ thông tin của mã đó.</p>
  <!-- Tìm kiếm + bốn bộ lọc + đếm mã + tải JSON trên MỘT hàng ngang. Trước đây thanh tìm
       kiếm và hàng bộ lọc là hai khối xếp dọc, chiếm hai dòng và đẩy bảng xuống thấp.
       Năm `<select>` không còn nhãn nổi phía trên; nhãn nằm trong option mặc định và
       aria-label, nên mỗi ô chỉ cao một dòng. -->
  <div class="toolbar filters" id="filters">
    <label class="search-wrap">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Lọc theo mã chứng quyền…" autocomplete="off"
             aria-label="Lọc theo mã chứng quyền">
    </label>
    <!-- Ô lọc tự ẩn khi kho không có trường tương ứng (ví dụ chưa nạp điều khoản), thay vì
         hiện ô rỗng bấm vào không có kết quả. -->
    <select class="select" id="f-underlying" aria-label="Chứng khoán cơ sở"><option value="">Chứng khoán cơ sở</option></select>
    <select class="select" id="f-moneyness" aria-label="Trạng thái tiền">
      <option value="">ITM / ATM / OTM</option>
      <option value="ITM">ITM</option><option value="ATM">ATM</option><option value="OTM">OTM</option>
    </select>
    <select class="select" id="f-maturity" aria-label="Tháng đáo hạn"><option value="">Tháng đáo hạn</option></select>
    <select class="select" id="f-issuer" aria-label="Công ty phát hành"><option value="">Công ty phát hành</option></select>
    <div class="toolbar-right">
      <button id="f-reset" type="button" class="ghost" title="Xoá toàn bộ điều kiện lọc">Xoá lọc</button>
      <span class="summary-count" id="summary"></span>
      <button id="download" type="button" class="btn">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Tải JSON snapshot
      </button>
    </div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr>
      <th aria-sort="none"><button type="button" class="board-sort" data-board-sort="ticker">Mã CW <span aria-hidden="true">↕</span></button></th>
      <th title="Giá đóng cửa phiên trước (nguồn: RefP)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="reference">Giá tham chiếu <span aria-hidden="true">↕</span></button></th>
      <th title="Giá của lệnh khớp cuối cùng — cũng là giá đóng cửa của phiên (nguồn: LastMP)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="last">Giá khớp cuối <span aria-hidden="true">↕</span></button></th>
      <th title="Thay đổi so với giá tham chiếu (nguồn: refChangePct)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="change">% trong ngày <span aria-hidden="true">↕</span></button></th>
      <th title="Giá khớp cao nhất trong phiên (nguồn: HighestP)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="high">Cao nhất <span aria-hidden="true">↕</span></button></th>
      <th title="Giá khớp thấp nhất trong phiên (nguồn: LowestP)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="low">Thấp nhất <span aria-hidden="true">↕</span></button></th>
      <th title="Tổng khối lượng khớp trong phiên (nguồn: TotalVol)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="volume">Tổng KL <span aria-hidden="true">↕</span></button></th>
      <th title="Tổng giá trị khớp trong phiên, đơn vị VND (nguồn: TotalVal)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="value">Tổng giá trị <span aria-hidden="true">↕</span></button></th>
      <th title="Phần trăm giá trị giao dịch của mã trên toàn bảng" aria-sort="none"><button type="button" class="board-sort" data-board-sort="share">Tỷ trọng GT <span aria-hidden="true">↕</span></button></th>
      <th title="Chênh lệch giá mua–bán, tính theo bước giá 10 VND (nguồn: S1P, B1P)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="spread">Chênh lệch mua–bán <span aria-hidden="true">↕</span></button></th>
      <th title="Khối ngoại còn được mua thêm (nguồn: FRoom)" aria-sort="none"><button type="button" class="board-sort" data-board-sort="room">Room ngoại <span aria-hidden="true">↕</span></button></th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="11" id="state">Đang tải…</td></tr></tbody>
  </table></div>
  </section>
  <!-- Ghi chú phương pháp đã chuyển vào tab Thuật ngữ (nhóm "Nguồn gốc số liệu"),
       để chân trang không còn là một khối chữ dày đặc ngay dưới bảng giá. -->
  <footer id="app-footer" class="disclaimer-banner" role="note"></footer>
</main>
<script type="module">
import {
  initI18n, initTheme, startClock, applyI18n, num as uiNum, bi, getLang, onLangChange, translate as translateUI,
} from './assets/ui.js';
import { initDetail, openDetail } from './assets/detail.js';
import katex from './assets/katex/katex.mjs';
import { VIEW_SLUGS, urlForView, viewFromSearch } from './assets/navigation.mjs';
import { finiteMetric as kpiValue, metricNumber as kpiNum, metricPercent as kpiPct, safeRatioPercent as kpiShare, safeDivide } from './assets/kpi-metrics.mjs';
import { sortBoardRows } from './assets/board-sort.mjs';

const DETAILS_URL = 'data/yuanta_details.json';
const SNAPSHOT_URL = 'data/yuanta_snapshot.json';
const ANALYSIS_URL = 'data/yuanta_board_analysis.json';
const ANALYTICS_URL = 'data/yuanta_analytics.json';
const SESSIONS_URL = 'data/yuanta_sessions.json';
let snapshot = null;
let analysis = null;
let analytics = null;
let sessions = null;
const esc = (value) => String(value ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cell = (row,key) => row[key] === null || row[key] === undefined ? '—' : esc(row[key]);
const num = (value, digits = 0) => (value === null || value === undefined || Number.isNaN(value))
  ? '—' : value.toLocaleString('vi-VN', {minimumFractionDigits: digits, maximumFractionDigits: digits});
const numLang = (value, digits = 0) => (value === null || value === undefined || Number.isNaN(value))
  ? '—' : Number(value).toLocaleString(getLang() === 'en' ? 'en-US' : 'vi-VN', {minimumFractionDigits: digits, maximumFractionDigits: digits});
const pct = (value, digits = 2) => (value === null || value === undefined) ? '—' : `${value.toFixed(digits)}%`;
const tx = (text) => getLang() === 'en' ? (translateUI(text) || text) : text;
// Dòng phân tích được key theo mã để bảng có thể hiển thị cả cột suy ra.
// Phải dựng SAU khi tải xong analysis — dựng ở cấp module sẽ luôn rỗng.
let derived = new Map();
function indexAnalysis(){
  derived = new Map(((analysis?.movers?.all) || []).map(r => [String(r.t).toUpperCase(), r]));
}

// Chi tiết từng mã từ `details.json`: cần cho ITM/ATM/OTM, ngày đáo hạn và tổ chức phát hành
// — ba trường chỉ có ở đó. Tải riêng để bảng giá vẫn dùng được nếu file này thiếu.
let detailsBy = new Map();
function indexDetails(){
  detailsBy = new Map((details?.rows || []).map(r => [String(r.ticker).toUpperCase(), r]));
}
const moneynessOf = (code) => (detailsBy.get(code)?.valuation?.moneyness) || null;
const maturityOf  = (code) => (detailsBy.get(code)?.valuation?.maturity) || null;
const issuerOf    = (code) => detailsBy.get(code)?.issuer || null;

// Nhóm đáo hạn theo tháng cho dễ chọn — "2027-03" thay vì 407 ngày khác nhau.
const maturityBucket = (iso) => (iso ? String(iso).slice(0, 7) : null);

function fillFilters(){
  // Nhãn nằm ngay trong option đầu tiên ("Chứng khoán cơ sở", "Tháng đáo hạn"…), nên ô lọc
  // chỉ cao một dòng thay vì hai như khi có nhãn nổi phía trên.
  const fill = (id, values, label) => {
    const el = document.querySelector(id);
    if (!el) return;
    const opts = [...new Set(values.filter(Boolean))].sort();
    const previous = el.value;
    el.innerHTML = `<option value="">${esc(label)}</option>` +
      opts.map(v => `<option value="${escAttr(v)}">${esc(v)}</option>`).join('');
    // Ẩn cả ô khi kho không có trường này (ví dụ chưa nạp điều khoản hợp đồng).
    const wrap = el.closest('.filter');
    if (wrap) wrap.hidden = opts.length === 0;
    el.hidden = opts.length === 0;
    if (opts.includes(previous)) el.value = previous;
  };
  const codes = (snapshot?.rows || []).map(r => String(r.StockCode).toUpperCase());
  fill('#f-underlying', codes.map(c => detailsBy.get(c)?.underlying
        || derived.get(c)?.u || null), 'Chứng khoán cơ sở');
  // moneyness: dùng danh sách cố định, không lấy từ dữ liệu, để ô lọc luôn đủ ba lựa chọn.
  document.querySelector('#f-moneyness').hidden = !codes.some(c => moneynessOf(c));
  fill('#f-maturity', codes.map(c => maturityBucket(maturityOf(c))), 'Tháng đáo hạn');
  fill('#f-issuer', codes.map(c => issuerOf(c)), 'Công ty phát hành');
}

// Toàn cảnh thị trường: gộp những chỉ số mô tả được cả thị trường từ dữ liệu đã publish.
// Nguyên tắc: chỉ số nào không tính được thì bỏ hẳn ô đó — không in 0, không in "—" cho có.
// Icon đơn sắc (Lucide, nhúng inline). Emoji trước đây được dùng cho thẻ KPI nhưng mỗi
// emoji có bảng màu riêng nên hàng thẻ trông lộn xộn và không hợp bảng số liệu tài chính.
const ICONS = {
  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  coins: '<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
  bank: '<path d="M3 22h18"/><path d="M6 18v-7"/><path d="M10 18v-7"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="m12 2 8 5H4Z"/>',
  trending: '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  arrows: '<path d="m8 3-4 4 4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/>',
  percent: '<line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  pin: '<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
  landmark: '<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
};
// Nét vẽ đồng nhất 1.75, màu theo currentColor → mỗi chế độ tự có màu đúng.
const icon = (name, cls = 'ov-ico') =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
// Compact VND amounts retain a decimal point in both languages.
const kpiShortVnd = value => {
  const amount = kpiValue(value);
  if (amount === null) return '—';
  if (amount >= 1e9) return `${(amount / 1e9).toFixed(2)} ${bi('tỷ', 'bn')}`;
  if (amount >= 1e6) return `${(amount / 1e6).toFixed(1)} ${bi('tr', 'm')}`;
  return kpiNum(amount);
};

// Stacked distributions always use their stated denominator; unavailable segments are 0 wide.
function miniBars(items, total, options = {}){
  const denominator = kpiValue(total);
  const segments = items.map(([label, value, variant, pctValue]) => {
    const count = kpiValue(value);
    const pct = pctValue ?? kpiShare(value, denominator);
    const width = count !== null && denominator !== null && denominator > 0
      ? Math.max(0, Math.min(100, count / denominator * 100)) : 0;
    return `<span class="stack-segment ${variant}" style="width:${width}%" title="${esc(tx(label))}: ${kpiNum(count)} (${pct}%)"></span>`;
  }).join('');
  const legend = items.map(([label, value, variant, pctValue]) => {
    const pct = pctValue ?? kpiShare(value, denominator);
    const detail = options.percentOnly ? `(${pct}%)` : `${kpiNum(value)} (${pct}%)`;
    return `<span class="legend-pill ${variant}"><i></i>${esc(tx(label))} <b>${detail}</b></span>`;
  }).join('');
  return `<div class="ov-distribution"><div class="stack-track" role="img" aria-label="${items.map(([label, value, , pctValue]) => `${tx(label)}: ${kpiNum(value)} (${pctValue ?? kpiShare(value, denominator)}%)`).join(', ')}">${segments}</div><div class="stack-legend">${legend}</div></div>`;
}

function renderOverview(){
  const host = document.querySelector('#overview');
  const grid = document.querySelector('#ov-grid');
  if (!host || !grid) return;
  const s = analysis?.summary;
  const val = analytics?.valuation;
  const rows = snapshot?.rows || [];
  if (!s || !rows.length) { host.hidden = true; return; }

  const totalCW = rows.length;
  const activeCW = kpiValue(s.traded);
  const inactiveCW = kpiValue(s.untraded);
  const activePct = kpiShare(activeCW, totalCW);
  const inactivePct = kpiShare(inactiveCW, totalCW);
  const totalValue = kpiValue(s.totalValueVND);
  const avgValuePerActiveCW = safeDivide(totalValue, activeCW);
  const totalUnderlyings = kpiValue(s.underlyings);
  const avgCWPerUnderlying = safeDivide(totalCW, totalUnderlyings);

  // ITM/ATM/OTM is counted from the loaded valuation state for this snapshot only.
  const counts = {ITM: 0, ATM: 0, OTM: 0};
  let moneynessDataAvailable = false;
  for (const row of rows) {
    const moneyness = moneynessOf(String(row.StockCode).toUpperCase());
    if (moneyness && Object.hasOwn(counts, moneyness)) {
      counts[moneyness] += 1;
      moneynessDataAvailable = true;
    }
  }
  const pricedCount = moneynessDataAvailable
    ? counts.ITM + counts.ATM + counts.OTM : null;
  const itmPct = kpiShare(moneynessDataAvailable ? counts.ITM : null, pricedCount);
  const atmPct = kpiShare(moneynessDataAvailable ? counts.ATM : null, pricedCount);
  const otmPct = kpiShare(moneynessDataAvailable ? counts.OTM : null, pricedCount);
  const valSummary = val?.summary || {};
  const ivhv = val?.ivVsHv || {};
  const medianIvSpread = kpiValue(ivhv.medianIvMinusHv);
  const upCount = kpiValue(s.gainers);
  const downCount = kpiValue(s.losers);
  const unchangedCount = kpiValue(s.unchanged);
  const activeChangeCW = upCount !== null && downCount !== null && unchangedCount !== null
    ? upCount + downCount + unchangedCount : null;
  const upPct = kpiShare(upCount, activeChangeCW);
  const downPct = kpiShare(downCount, activeChangeCW);
  const unchangedPct = kpiShare(unchangedCount, activeChangeCW);
  const ivAboveCount = kpiValue(ivhv.countIvAboveHv);
  const ivBelowCount = kpiValue(ivhv.countIvBelowHv);
  const validSpreadCount = ivAboveCount !== null && ivBelowCount !== null
    ? ivAboveCount + ivBelowCount : null;
  const abovePct = kpiShare(ivAboveCount, validSpreadCount);
  const belowPct = kpiShare(ivBelowCount, validSpreadCount);

  const q1Iv = kpiValue(valSummary.p25Iv);
  const medianIv = kpiValue(valSummary.medianIv);
  const q3Iv = kpiValue(valSummary.p75Iv);
  const iqrWidth = q1Iv !== null && q3Iv !== null ? q3Iv - q1Iv : null;
  const iqrRatio = iqrWidth !== null && iqrWidth > 0
    ? safeDivide(medianIv === null ? null : medianIv - q1Iv, iqrWidth) : null;
  const iqrMarker = medianIv !== null && iqrWidth !== null && iqrWidth >= 0
    ? (iqrWidth === 0 ? 50
      : iqrRatio === null ? null : Math.max(0, Math.min(100, iqrRatio * 100)))
    : null;

  const cards = [
    {
      id: 'listed', tier: 'primary', k: 'Mã CW niêm yết', v: kpiNum(totalCW),
      icon: 'layers', iconTone: 'indigo',
      footer: miniBars([
        ['Khớp lệnh', activeCW, 'up', activePct],
        ['Không GD', inactiveCW, 'inactive', inactivePct],
      ], totalCW),
    },
    {
      id: 'value', tier: 'primary', k: 'Giá trị giao dịch',
      v: kpiShortVnd(totalValue), icon: 'coins', iconTone: 'emerald',
      badge: `VND · ${tx('Phiên hiện tại')}`,
      footer: `<div class="ov-value-footer"><span>${esc(tx('Bình quân / mã khớp lệnh'))}</span><b>${esc(kpiShortVnd(avgValuePerActiveCW))}</b></div>`,
    },
    {
      id: 'breadth', tier: 'primary', k: 'Tăng / giảm / đứng', icon: 'trending', iconTone: 'cyan',
      split: [
        ['up', kpiNum(upCount), 'Tăng', upPct],
        ['down', kpiNum(downCount), 'Giảm', downPct],
        ['flat', kpiNum(unchangedCount), 'Đứng', unchangedPct],
      ],
      compactSplit: true,
      footer: miniBars([
        ['Tăng', upCount, 'up', upPct], ['Giảm', downCount, 'down', downPct],
        ['Đứng', unchangedCount, 'flat', unchangedPct],
      ], activeChangeCW, {percentOnly: true}),
    },
    {
      id: 'underlyings', tier: 'secondary', k: 'Cổ phiếu cơ sở',
      v: kpiNum(totalUnderlyings), icon: 'bank', iconTone: 'blue',
      footer: `<div class="ov-value-footer"><span>${esc(tx('Mật độ phân bổ'))}</span><b>~${esc(kpiNum(avgCWPerUnderlying, 1))} ${esc(tx('CW / cổ phiếu cơ sở'))}</b></div>`,
    },
    {
      id: 'moneyness', tier: 'secondary', k: 'Phân bố trạng thái tiền', icon: 'target', iconTone: 'amber',
      badge: `${tx('Đã định giá')}: ${kpiNum(pricedCount)}/${kpiNum(totalCW)}`,
      split: [
        ['itm', kpiNum(moneynessDataAvailable ? counts.ITM : null), 'ITM', itmPct],
        ['atm', kpiNum(moneynessDataAvailable ? counts.ATM : null), 'ATM', atmPct],
        ['otm', kpiNum(moneynessDataAvailable ? counts.OTM : null), 'OTM', otmPct],
      ],
      footer: miniBars([
        ['ITM', moneynessDataAvailable ? counts.ITM : null, 'itm', itmPct],
        ['ATM', moneynessDataAvailable ? counts.ATM : null, 'atm', atmPct],
        ['OTM', moneynessDataAvailable ? counts.OTM : null, 'otm', otmPct],
      ], pricedCount),
    },
    {
      id: 'iv', tier: 'secondary', k: 'IV trung vị', v: kpiPct(medianIv),
      icon: 'activity', iconTone: 'violet',
      footer: `<div class="ov-iqr"><div class="ov-iqr-label">${esc(tx('Biên độ IQR (Q1–Q3)'))}</div>`
        + `<div class="ov-iqr-track" role="img" aria-label="${esc(tx('Biên độ IQR (Q1–Q3)'))}: ${esc(kpiPct(q1Iv))}–${esc(kpiPct(q3Iv))}">`
        + `${iqrMarker === null ? '' : `<span class="ov-iqr-marker" style="left:${iqrMarker}%" title="${esc(tx('Trung vị'))}: ${esc(kpiPct(medianIv))}"></span>`}</div>`
        + `<div class="ov-iqr-values"><span>Q1 <b>${esc(kpiPct(q1Iv))}</b></span><span>Q3 <b>${esc(kpiPct(q3Iv))}</b></span></div></div>`,
    },
    {
      id: 'iv-hv', tier: 'secondary', k: 'IV − HV',
      v: medianIvSpread === null ? '—'
        : `${medianIvSpread > 0 ? '+' : ''}${kpiNum(medianIvSpread, 1)} ${tx('điểm')}`,
      icon: 'scale', iconTone: 'rose',
      tone: medianIvSpread === null || medianIvSpread === 0 ? '' : medianIvSpread > 0 ? 'premium' : 'discount',
      footer: miniBars([
        ['IV > HV', ivAboveCount, 'up', abovePct],
        ['IV < HV', ivBelowCount, 'down', belowPct],
      ], validSpreadCount),
    },
    {
      id: 'spread', tier: 'secondary', k: 'Spread trung vị',
      v: kpiPct(s.medianSpreadPct, 1), icon: 'arrows', iconTone: 'slate',
      footer: `<div class="ov-value-footer"><span>${esc(tx('Chênh lệch bid-ask'))}</span>`
        + `<b>${esc(kpiNum(s.medianSpreadTicks, 1))} ${esc(tx('bước giá'))} (${esc(kpiNum(s.medianSpreadAbsVND, 1))} VND)</b></div>`,
    },
  ];

  const renderCard = card => {
    const cardClass = `ov-card ov-card-${card.tier} ov-card-${card.id}`;
    const badge = card.badge ? `<span class="ov-badge">${esc(card.badge)}</span>` : '';
    const value = card.split
      ? `<div class="ov-split${card.compactSplit ? ' ov-split-counts' : ''}"${card.compactSplit ? ` role="group" aria-label="${esc(tx(card.k))}"` : ''}>${card.split.map(([tone, count, label, pct]) => {
        const percentLabel = pct === '—' ? '—' : `${pct}%`;
        const splitLabel = card.compactSplit
          ? `<span class="sr-only">${esc(tx(label))}</span>`
          : `<span class="ov-split-label">${esc(tx(label))}<b>${esc(percentLabel)}</b></span>`;
        return `<div class="ov-split-item ${tone}"><span class="ov-split-value">${esc(count)}</span>${splitLabel}</div>`;
      }).join('')}</div>`
      : `<div class="ov-v${card.tone ? ` ${card.tone}` : ''}">${esc(card.v)}</div>`;
    return `<article class="${cardClass}" data-tier="${card.tier}">`
      + `<div class="ov-k"><div class="ov-k-main"><span class="ov-icon-badge ${card.iconTone}">${icon(card.icon)}</span>`
      + `<span class="ov-k-title">${esc(tx(card.k))}</span></div>${badge}</div>`
      + value + `<div class="ov-footer${card.footer.startsWith('<div class="ov-distribution') ? ' ov-footer-stack' : ''}">${card.footer}</div></article>`;
  };
  const primaryCards = cards.filter(card => card.tier === 'primary').map(renderCard).join('');
  const secondaryCards = cards.filter(card => card.tier === 'secondary').map(renderCard).join('');
  grid.innerHTML = `<div class="ov-tier ov-tier-primary" role="group" aria-label="${esc(tx('Chỉ số chính'))}">${primaryCards}</div>`
    + `<div class="ov-tier ov-tier-secondary" role="group" aria-label="${esc(tx('Chỉ số định lượng'))}">${secondaryCards}</div>`;
  host.hidden = false;
}

// Hàng thẻ thống kê thứ ba đã bị bỏ: nó lặp lại đúng năm chỉ số của #ov-grid (CW trong
// snapshot, Giá trị giao dịch, Spread trung vị, Cổ phiếu cơ sở, Tăng/giảm). Giữ lại hàm
// rỗng để các lời gọi cũ không vỡ, và để #stats không chiếm chỗ trống trên trang.
function renderStats(){
  const host = document.querySelector('#stats');
  if (host) host.innerHTML = '';
}

// "Dữ liệu cập nhật lúc …" — giờ tuyệt đối theo ICT, kèm độ trễ để biết dữ liệu cũ hay mới.
function renderFreshness(){
  const host = document.querySelector('#freshness');
  const sub = document.querySelector('#sub-line-text');
  const at = analytics?.fetchedAt || snapshot?.fetchedAt;

  // Metadata chỉ có một dòng, có nhãn cập nhật rõ ràng và giữ nguyên icon đồng hồ trong DOM.
  // `#freshness` chỉ là chỗ hiện TRẠNG THÁI khi chưa có giờ (đang tải / lỗi). Có giờ rồi thì
  // ẩn hẳn — để hai dòng cùng nói một mốc thời gian là đúng lỗi cần sửa.
  const paint = (content, pending) => {
    if (sub) {
      if (pending) sub.textContent = bi('Đang tải dữ liệu…', 'Loading market data…');
      else sub.innerHTML = content;
    }
    if (host) {
      host.hidden = !pending;
      const stamp = host.querySelector('#stamp');
      if (pending && stamp) stamp.textContent = content;
    }
  };

  const loading = bi('Đang đọc snapshot…', 'Loading snapshot…');
  if (!at) {
    paint(loading, true);
    return;
  }
  const when = new Date(at);
  if (Number.isNaN(when.getTime())) {
    paint(loading, true);
    return;
  }

  const dateLocale = getLang() === 'en' ? 'en-GB' : 'vi-VN';
  const updatedTime = when.toLocaleTimeString('vi-VN', {timeZone:'Asia/Ho_Chi_Minh',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  const updatedDate = when.toLocaleDateString(dateLocale, {timeZone:'Asia/Ho_Chi_Minh',
    day:'2-digit', month:'2-digit', year:'numeric'});
  // Mã phiên lấy từ kho lịch sử; thiếu thì bỏ phần đó thay vì in "Phiên —".
  const session = sessions?.coverage?.last;
  const sessionMeta = session
    ? ` · <strong>${bi('Phiên','Session')} ${esc(session)}</strong>` : '';
  paint(bi(
    `Cập nhật: <strong>${updatedTime} ICT</strong> (${updatedDate})${sessionMeta}.`,
    `Updated: <strong>${updatedTime} ICT</strong> (${updatedDate})${sessionMeta}.`), false);
}

const boardSort = {key: null, direction: 'desc'};
const boardSortValue = (row, key) => {
  const code = String(row.StockCode ?? '').trim().toUpperCase();
  const d = derived.get(code) || {};
  switch (key) {
    case 'ticker': return code;
    case 'reference': return row.RefP;
    case 'last': return d.traded === true ? d.lastPrice : null;
    case 'change': return d.priceChangePct;
    case 'high': return row.HighestP;
    case 'low': return row.LowestP;
    case 'volume': return row.TotalVol;
    case 'value': return row.TotalVal;
    case 'share': return d.valueSharePct;
    case 'spread': return d.spreadTicks;
    case 'room': return row.FRoom;
    default: return null;
  }
};

function render(){
  const query = document.querySelector('#search').value.trim().toUpperCase();
  const fUnderlying = document.querySelector('#f-underlying')?.value || '';
  const fMoneyness  = document.querySelector('#f-moneyness')?.value || '';
  const fMaturity   = document.querySelector('#f-maturity')?.value || '';
  const fIssuer     = document.querySelector('#f-issuer')?.value || '';
  const list = (snapshot?.rows || []).filter(r => {
    const code = String(r.StockCode ?? '').trim().toUpperCase();
    if (query && !code.includes(query)) return false;
    if (fUnderlying && (detailsBy.get(code)?.underlying || derived.get(code)?.u) !== fUnderlying) return false;
    if (fMoneyness && moneynessOf(code) !== fMoneyness) return false;
    if (fMaturity && maturityBucket(maturityOf(code)) !== fMaturity) return false;
    if (fIssuer && issuerOf(code) !== fIssuer) return false;
    return true;
  });
  document.querySelector('#summary').textContent = `${list.length.toLocaleString('vi-VN')} / ${(snapshot?.count || 0).toLocaleString('vi-VN')} mã`;
  const tbody = document.querySelector('#rows');
  const sortedList = boardSort.key
    ? sortBoardRows(list, boardSort.key, boardSort.direction, boardSortValue)
    : list;
  document.querySelectorAll('thead button[data-board-sort]').forEach(header => {
    const key = header.dataset.boardSort;
    const active = key === boardSort.key;
    const th = header.matches('th') ? header : header.closest('th');
    th?.setAttribute('aria-sort', active ? (boardSort.direction === 'desc' ? 'descending' : 'ascending') : 'none');
    const indicator = header.querySelector('span');
    if (indicator) {
      indicator.textContent = active ? (boardSort.direction === 'desc' ? '↓' : '↑') : '↕';
      header.setAttribute('aria-pressed', String(active));
    }
  });
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="11" id="state">Không có mã phù hợp.</td></tr>'; return; }
  tbody.innerHTML = sortedList.map(r => {
    const code = String(r.StockCode ?? '').trim().toUpperCase();
    const d = derived.get(code) || {};
    // Ba trạng thái tiền dùng xanh/vàng/đỏ; xám chỉ báo thiếu dữ liệu, không suy đoán trạng thái.
    const money = moneynessOf(code);
    const moneyCls = money === 'ITM' ? 'money-itm' : money === 'ATM' ? 'money-atm'
      : money === 'OTM' ? 'money-otm' : 'money-unknown';
    // Tăng xanh, giảm đỏ, đứng giá vàng. `null` (không khớp lệnh) không tô.
    const chgCls = d.priceChangePct > 0 ? 'chg-up' : d.priceChangePct < 0 ? 'chg-down'
      : (d.priceChangePct === 0 ? 'chg-flat' : '');
    const codeAttr = escAttr(code);
    // Nhãn ITM/ATM/OTM hiện ngay cạnh mã để thấy được khi quét bảng, kèm tooltip giải thích.
    const moneyTag = ` <span class="mtag ${moneyCls}"${money ? '' : ` title="${escAttr(bi('Chưa định giá — trạng thái tiền chưa xác định','Unpriced — moneyness unknown'))}"`}>${esc(money || '—')}</span>`;
    const traded = d.traded === true;
    // Cột "Giá khớp cuối": mã không khớp lệnh không có giá đóng cửa, ô để trống thay vì
    // dùng lại giá phiên trước — giá cũ sẽ tạo ra biến động ảo.
    const lastPrice = traded
      ? num(d.lastPrice)
      : '<span class="idle" title="Không khớp lệnh trong phiên — không có giá đóng cửa">—</span>';
    return `<tr><td><button type="button" class="ticker-btn" data-ticker="${codeAttr}">${cell(r,'StockCode')}</button>${moneyTag}</td>`
      + `<td>${cell(r,'RefP')}</td>`
      + `<td class="num">${lastPrice}</td>`
      + `<td class="num ${chgCls}">${pct(d.priceChangePct)}</td>`
      + `<td>${cell(r,'HighestP')}</td>`
      + `<td>${cell(r,'LowestP')}</td>`
      + `<td>${cell(r,'TotalVol')}</td>`
      + `<td>${cell(r,'TotalVal')}</td>`
      + `<td class="num">${pct(d.valueSharePct)}</td>`
      + `<td class="num">${num(d.spreadTicks, 1)}</td>`
      + `<td>${cell(r,'FRoom')}</td></tr>`;
  }).join('');
}

// Phân tích là file riêng: nếu thiếu/lỗi, bảng vẫn dùng được ở chế độ trường gốc.
async function loadAnalysis(){
  try {
    const response = await fetch(`${ANALYSIS_URL}?v=${Date.now()}`, {cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const payload = await response.json();
    if(payload.schemaVersion !== 1) throw new Error('Sai schema phân tích');
    analysis = payload;
  } catch(error) {
    // Khối cảnh báo chất lượng đã bị bỏ khỏi giao diện. Thiếu lớp phân tích thì bảng vẫn
    // hiển thị trường gốc; lý do ghi ra console để người vận hành còn thấy, không im lặng.
    analysis = null;
    console.warn('Chưa có lớp phân tích:', error.message);
  }
}

function simpleTable(headers, rows, renderRow, emptyText) {
  const label = (header) => getLang() === 'en' ? (EN_TABLE_HEADERS[header] || header) : header;
  if (!rows || !rows.length) {
    const empty = emptyText || 'Không có dữ liệu';
    return `<div class="empty">${esc(getLang() === 'en' ? (empty === 'Không có dữ liệu' ? 'No data available' : empty) : empty)}</div>`;
  }
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${esc(label(h))}</th>`).join('')}</tr></thead>`
    + `<tbody>${rows.map(renderRow).join('')}</tbody></table></div>`;
}

/**
 * Danh sách thanh ngang. Giá trị lớn nhất trong nhóm = thanh đầy.
 *
 * Ba điểm phải giữ đúng, mỗi điểm ứng với một lỗi đã từng có trên trang:
 *
 * 1. `max` tính trên giá trị THÔ, không dùng `|| 0`. Dùng `|| 0` thì null và 0 không phân biệt
 *    được, và một nhóm toàn số 0 sẽ chia cho `1` rồi vẽ ra thanh rỗng — trông như "có dữ liệu
 *    nhưng rất nhỏ" thay vì "không có dữ liệu".
 * 2. Giá trị null/0 KHÔNG được vẽ thanh. "Không giao dịch" mà có thanh thì biểu đồ đang nói
 *    dối; ở đây để trống rãnh và ghi đúng nhãn `valueFormat(null)`.
 * 3. Thanh nhỏ nhất vẫn phải nhìn thấy được — nhưng chỉ khi giá trị > 0.
 *
 * @param useShares true khi giá trị đã là tỷ trọng (%): lúc đó thanh dài đúng bằng tỷ trọng
 *   trên tổng, so sánh được với cột "Tỷ trọng" trong bảng. false khi giá trị là VND: chia theo
 *   giá trị lớn nhất, nếu không thì mọi thanh đều không thấy được (25,76 tỷ so với 4,1 tr).
 */
function barList(items, labelKey, valueKey, valueFormat, options = {}) {
  const { useShares = false } = options;
  const raw = items.map(i => i[valueKey]);
  const max = Math.max(...raw.filter(v => v !== null && v !== undefined && v > 0), 0);
  return `<div class="bars">${items.map((item, idx) => {
    const value = raw[idx];
    const hasValue = value !== null && value !== undefined && value > 0;
    let width = 0;
    if (hasValue) {
      width = useShares ? value : (max > 0 ? value / max * 100 : 0);
      width = Math.max(1.5, Math.min(100, width));   // 1,5% là ngưỡng còn nhìn thấy
    }
    return `<div class="bar"><span>${esc(item[labelKey])}</span>`
      + `<span class="track">${hasValue
        ? `<span class="fill" style="width:${width.toFixed(1)}%"></span>` : ''}</span>`
      + `<span class="val">${esc(valueFormat(value))}</span></div>`;
  }).join('')}</div>`;
}

function sparkline(values, labels) {
  const points = values.filter(v => v !== null && v !== undefined);
  if (points.length < 2) return '';
  const w = 100, h = 100;
  const min = Math.min(...points), max = Math.max(...points);
  const span = (max - min) || 1;
  // Nối liền qua phiên thiếu giá trị, nhưng vẫn giữ đúng vị trí thời gian.
  const coords = values.map((v, i) => v === null || v === undefined ? null
    : [i / (values.length - 1) * w, h - (v - min) / span * h]);
  const path = coords.filter(Boolean).map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
  const dots = coords.filter(Boolean).map(([x, y]) => `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.6" fill="#43d3a0"/>`).join('');
  const skipped = values.filter(v => v === null || v === undefined).length;
  const title = `${labels[0]} → ${labels[labels.length - 1]} · ${points.length} phiên có giá`
    + (skipped ? ` · ${skipped} phiên không khớp (ngắt quãng)` : '');
  return `<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="${escAttr(title)}">`
    + `<title>${esc(title)}</title><path d="${path}" fill="none" stroke="#43d3a0" stroke-width="1.2" vector-effect="non-scaling-stroke"/>${dots}</svg>`;
}

// ── Định giá: Black–Scholes + IV, từ điều khoản Vietstock ──
const valuationTableState = {query: '', page: 0, size: 25, sort: 'ivResidualPct', dir: 'asc'};
let valuationRowsCache = [];
const valuationColumns = [
  ['ticker','Mã'], ['underlying','Cơ sở'], ['iv','IV'], ['ivGroupMedian','IV nhóm'],
  ['ivResidualPct','Chênh lệch IV'], ['ivMinusHv','IV − HV'], ['delta','Delta'],
  ['moneyness','ITM/OTM'], ['strike','Strike'], ['underlyingPrice','S'],
  ['underlyingSource','Nguồn S'], ['cwPrice','Giá CW'], ['daysToMaturity','Đáo hạn (ngày)'], ['premiumPct','Premium'],
];
const valCell = (r, key) => ({
  ticker: r.ticker, underlying: r.underlying, iv: r.iv, ivGroupMedian: r.ivGroupMedian,
  ivResidualPct: r.ivResidualPct, ivMinusHv: r.ivMinusHv, delta: r.delta,
  moneyness: r.moneyness, strike: r.strike, underlyingPrice: r.underlyingPrice,
  underlyingSource: r.underlyingSource, cwPrice: r.cwPrice,
  daysToMaturity: r.daysToMaturity, premiumPct: r.premiumPct,
}[key]);
function valuationRow(r){
  const residual = Number(r.ivResidualPct);
  const ivhv = Number(r.ivMinusHv);
  const source = r.underlyingSource || '—';
  const date = source.match(/\((\d{4})-(\d{2})-(\d{2})\)/);
  const sourceShort = date ? `${bi('Đóng cửa','Close')} · ${date[3]}/${date[2]}`
    : /premium|đòn bẩy/i.test(source) ? bi('Suy từ terms','Terms-derived') : bi('Nguồn S','S source');
  const moneyClass = r.moneyness === 'ITM' ? 'money-itm' : r.moneyness === 'ATM' ? 'money-atm' : r.moneyness === 'OTM' ? 'money-otm' : 'money-unknown';
  const days = Number(r.daysToMaturity);
  return `<tr>
    <td class="ticker-cell"><button class="ticker-btn" type="button" data-ticker="${escAttr(r.ticker)}">${esc(r.ticker)}</button></td>
    <td><span class="underlying-pill">${esc(r.underlying || '—')}</span></td>
    <td class="num">${fmtPct(r.iv,1)}</td><td class="num">${fmtPct(r.ivGroupMedian,1)}</td>
    <td class="num"><span class="value-signal ${residual < 0 ? 'positive' : residual > 0 ? 'negative' : ''}">${fmtPct(r.ivResidualPct,1)}</span></td>
    <td class="num"><span class="value-signal ${ivhv < 0 ? 'positive' : ivhv > 0 ? 'negative' : ''}">${r.ivMinusHv == null ? '—' : `${ivhv > 0 ? '+' : ''}${num(ivhv,1)}`}</span></td>
    <td class="num">${num(r.delta,3)}</td><td><span class="mtag ${moneyClass}">${esc(r.moneyness || '—')}</span></td>
    <td class="num">${fmtVnd(r.strike)}</td><td class="num">${fmtVnd(r.underlyingPrice)}</td>
    <td><span class="source-pill" title="${escAttr(tx(source))}">${esc(sourceShort)}</span></td>
    <td class="num">${fmtVnd(r.cwPrice)}</td><td class="num ${days < 14 ? 'maturity-critical' : days < 30 ? 'maturity-warn' : ''}">${num(r.daysToMaturity,0)}</td>
    <td class="num">${fmtPct(r.premiumPct,1)}</td>
  </tr>`;
}
function renderValuationTable(rows){
  const host = document.querySelector('#valuation-table');
  if (!host) return;
  valuationRowsCache = rows || [];
  const state = valuationTableState;
  const q = state.query.trim().toLowerCase();
  let filtered = valuationRowsCache.filter(r => !q || valuationColumns.some(([key]) => String(valCell(r,key) ?? '').toLowerCase().includes(q)));
  filtered.sort((a,b) => {
    const av=valCell(a,state.sort), bv=valCell(b,state.sort);
    const an=Number(av), bn=Number(bv);
    const cmp = av == null ? (bv == null ? 0 : 1) : bv == null ? -1
      : Number.isFinite(an) && Number.isFinite(bn) ? an-bn : String(av).localeCompare(String(bv));
    return cmp * (state.dir === 'asc' ? 1 : -1);
  });
  const pages = Math.max(1,Math.ceil(filtered.length/state.size));
  state.page = Math.min(state.page,pages-1);
  const start=state.page*state.size, pageRows=filtered.slice(start,start+state.size);
  host.innerHTML = `<div class="quant-table-toolbar"><label class="quant-search"><span aria-hidden="true">⌕</span><input id="valuation-search" type="search" value="${escAttr(state.query)}" placeholder="${bi('Tìm mã CW hoặc cổ phiếu cơ sở…','Search warrant or underlying…')}" aria-label="${bi('Tìm mã CW hoặc cổ phiếu cơ sở','Search warrant or underlying')}"></label><span class="quant-result-count">${num(filtered.length)} ${bi('mã','warrants')}</span></div>

}

// ── Xếp hạng: điểm 0–100 từ các trục ĐO ĐƯỢC, kèm lý do không có Black–Scholes ──
// ── Xếp hạng: bảng chấm điểm có sắp xếp, heatmap và huy hiệu top 3 ──
// Sắp xếp là trạng thái của RIÊNG bảng này; đổi tab rồi quay lại vẫn giữ lựa chọn.
const scoringSort = {key: 'score', dir: 'desc'};

// Thứ tự ưu tiên khi hai mã cùng điểm — so tiếp theo thanh khoản rồi tới giá trị.
const SCORING_DEFAULT_DIR = {score: 'desc', valueVND: 'desc', valuation: 'desc',
  priceQuality: 'desc', coveragePct: 'desc', liquidity: 'desc', cost: 'desc',
  chgPct: 'desc'};

const WEIGHT_LABELS = {
  liquidity: 'Thanh khoản', cost: 'Chi phí', valuation: 'Định giá',
  priceQuality: 'Chất lượng giá',
};
const WEIGHT_LABELS_EN = {liquidity: 'Liquidity', cost: 'Cost', valuation: 'Valuation', priceQuality: 'Price quality'};

/** Giá trị dùng để sắp xếp một dòng theo khoá của cột. */
function scoringValue(row, key) {
  if (key === 'ticker') return String(row.t || '');
  if (key === 'underlying') return String(row.u || '');
  if (key === 'chgPct') return row.chgPct === null || row.chgPct === undefined ? -Infinity : row.chgPct;
  if (key in WEIGHT_LABELS) {
    const v = row.parts?.[key];
    // Mã chưa có dữ liệu cho trục đó xếp cuối ở cả hai chiều — chúng không "thấp",
    // chúng chưa được chấm. Trộn chúng vào đầu/cuối đều là nói sai.
    return v === null || v === undefined ? -Infinity : v;
  }
  const v = row[key];
  return v === null || v === undefined ? -Infinity : v;
}

/**
 * Ô điểm thành phần: số + thanh tỷ lệ chạy dưới.
 * `null` là CHƯA CHẤM (ví dụ độ ổn định cần ≥5 phiên), khác hẳn điểm 0. Hai thứ đó
 * không được hiển thị giống nhau, nếu không người đọc sẽ hiểu mã bị trừ điểm.
 */
function partCell(value, label) {
  const labelText = getLang() === 'en' ? (EN_TABLE_HEADERS[label] || tx(label)) : label;
  if (value === null || value === undefined) {
    return `<td class="part-cell"><span class="na" title="${escAttr(labelText)}: ${bi('chưa đủ dữ liệu để chấm', 'not enough data to score')}">${bi('chưa chấm', 'not scored')}</span></td>`;
  }
  const v = Math.max(0, Math.min(100, value));
  return `<td class="part-cell"><span class="part-num">${num(v, 0)}</span>`
    + `<span class="part-track"><span class="part-fill b${Math.round(v / 20) * 20}" style="width:${v}%"></span></span></td>`;
}

/** Thẻ điểm tổng: nền theo mức điểm, số bên trong, thanh tỷ lệ ngay dưới. */
function scoreCell(score) {
  if (score === null || score === undefined) return '<td><span class="na">—</span></td>';
  // Ngưỡng đọc được: ≥80 mạnh, 60–80 trung bình, <60 yếu. Ba mức là đủ để quét mắt;
  // chia nhỏ hơn thì màu không còn phân biệt được nữa.
  const tone = score >= 80 ? 'strong' : score >= 60 ? 'mid' : 'weak';
  return `<td class="score-cell"><span class="score-badge ${tone}">${num(score, 1)}</span>`
    + `<span class="score-track"><span class="score-fill ${tone}" style="width:${Math.max(2, Math.min(100, score))}%"></span></span></td>`;
}

/** Huy hiệu hạng: vàng/bạc/đồng cho top 3, số thường cho phần còn lại. */
function rankCell(rank) {
  const medal = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
  return medal
    ? `<td class="rank-cell"><span class="medal ${medal}" title="${bi('Hạng', 'Rank')} ${rank}">${rank}</span></td>`
    : `<td class="rank-cell"><span class="rank-plain">${rank}</span></td>`;
}

/** % trong ngày: màu theo dấu + mũi tên. Tham chiếu (0%) dùng màu vàng cam. */
function changeCellRank(row) {
  const v = row.chgPct;
  if (v === null || v === undefined) return '<td class="num"><span class="na">—</span></td>';
  if (v > 0) return `<td class="num chg-up">▲ ${fmtPct(v)}</td>`;
  if (v < 0) return `<td class="num chg-down">▼ ${fmtPct(v)}</td>`;
  return `<td class="num chg-flat">= ${fmtPct(v)}</td>`;
}

/**
 * Cảnh báo của MỘT mã: gạch mờ khi không có, tam giác màu khi có, tooltip nêu lý do.
 *
 * `sc` cần thiết vì có trục thiếu dữ liệu ở TOÀN BỘ mã (hiện tại: độ ổn định, vì kho mới
 * có 1 phiên). Nếu cảnh báo theo độ phủ thì cả 50 dòng đều có tam giác và cột này mất
 * tác dụng phân biệt — chuyện đó đã xảy ra ở lần chạy thử đầu. Trục thiếu ở toàn bộ mã
 * được nêu MỘT lần ở banner; cột này chỉ nêu cái khác biệt giữa các mã.
 */
function warnCell(row, sc) {
  const notes = [];
  if (row.nearCeiling) notes.push(bi(
    `Giá đang sát trần (còn ${fmtPct(row.headroomPct)} tới trần)`,
    `Price is near the ceiling (${fmtPct(row.headroomPct)} headroom)`));
  const available = {
    valuation: sc?.valuation?.available,
    cost: true,
    liquidity: true,
    priceQuality: true,
  };
  const missing = [];
  if (row.parts?.valuation === null || row.parts?.valuation === undefined) {
    if (available.valuation) missing.push('định giá');
  }
  if (row.parts?.cost === null || row.parts?.cost === undefined) missing.push('chi phí');
  if (missing.length) {
    const missingLabels = getLang() === 'en'
      ? missing.map(label => ({'định giá': 'valuation', 'chi phí': 'cost'}[label] || tx(label)))
      : missing;
    notes.push(bi(
      `Thiếu dữ liệu để chấm: ${missing.join(', ')} — điểm chỉ tính trên phần còn lại`,
      `Missing data for ${missingLabels.join(', ')}; the score uses the remaining factors only`));
  }
  if (!notes.length) return '<td class="warn-cell"><span class="na">—</span></td>';
  const text = notes.join('. ');
  return `<td class="warn-cell"><span class="warn-icon" title="${escAttr(text)}">`
    + `${WARN_ICON}<span class="sr-only">${escAttr(text)}</span></span></td>`;
}

const WARN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>'
  + '<path d="M12 9v4"/><path d="M12 17h.01"/></svg>';

/** Mũi tên sắp xếp trên tiêu đề. `active` cho biết cột đang được sắp. */
function sortArrow(key) {
  const on = scoringSort.key === key;
  const dir = on ? scoringSort.dir : '';
  return `<span class="sort-arrow${on ? ' on' : ''}" aria-hidden="true">`
    + `<span class="sa-up${dir === 'asc' ? ' lit' : ''}">▲</span>`
    + `<span class="sa-down${dir === 'desc' ? ' lit' : ''}">▼</span></span>`;
}

function scoringHead(key, label, extra = '') {
  const on = scoringSort.key === key;
  const ariaSort = on ? (scoringSort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  return `<th class="sortable${on ? ' sorted' : ''}${extra}" data-sort="${key}" `
    + `aria-sort="${ariaSort}" tabindex="0" role="columnheader">`
    + `<span class="th-label">${esc(label)}</span>${sortArrow(key)}</th>`;
}

/**
 * 50 mã đầu theo lựa chọn sắp xếp hiện tại.
 *
 * Phải là HÀM, không phải biến tính một lần: lần bấm sắp xếp đầu tiên từng không có tác
 * dụng vì bảng được vẽ lại bằng đúng mảng đã tính TRƯỚC khi đổi khoá. Lỗi này chỉ lộ ra
 * khi bấm thử trên trang thật, không lộ qua test đọc chuỗi.
 */
function scoringRows(sc) {
  const all = sc.ranking || [];
  const key = scoringSort.key;
  const dir = scoringSort.dir === 'asc' ? 1 : -1;
  return [...all].sort((a, b) => {
    const va = scoringValue(a, key);
    const vb = scoringValue(b, key);
    if (va === vb) return a.rank - b.rank;              // hoà thì giữ thứ tự gốc
    if (va === -Infinity) return 1;                     // thiếu dữ liệu luôn ở cuối
    if (vb === -Infinity) return -1;
    return (va < vb ? -1 : 1) * dir;
  }).slice(0, 50);
}

/** Bảng xếp hạng 50 mã đầu. Sắp xếp lại thì chỉ vẽ lại phần này, không vẽ cả tab. */
function scoringTable(rows, sc) {
  return `<div class="table-wrap rank-wrap">
    <table class="rank-table">
      <thead><tr>
        ${scoringHead('rank', '#')}
        ${scoringHead('ticker', bi('Mã / Cơ sở', 'Ticker / Underlying'))}
        ${scoringHead('score', bi('Điểm tổng', 'Total score'))}
        ${scoringHead('coveragePct', bi('Độ phủ', 'Coverage'))}
        ${scoringHead('valueVND', bi('Giá trị', 'Value'))}
        ${scoringHead('chgPct', bi('% trong ngày', '% change'))}
        ${scoringHead('liquidity', `${bi(WEIGHT_LABELS.liquidity, WEIGHT_LABELS_EN.liquidity)} ${Math.round((sc.weights?.liquidity || 0) * 100)}%`)}
        ${scoringHead('cost', `${bi(WEIGHT_LABELS.cost, WEIGHT_LABELS_EN.cost)} ${Math.round((sc.weights?.cost || 0) * 100)}%`)}
        ${scoringHead('valuation', `${bi(WEIGHT_LABELS.valuation, WEIGHT_LABELS_EN.valuation)} ${Math.round((sc.weights?.valuation || 0) * 100)}%`)}
        ${scoringHead('priceQuality', `${bi(WEIGHT_LABELS.priceQuality, WEIGHT_LABELS_EN.priceQuality)} ${Math.round((sc.weights?.priceQuality || 0) * 100)}%`)}
        <th class="warn-head">${bi('Cảnh báo', 'Warnings')}</th>
      </tr></thead>
      <tbody>${rows.map(r => `<tr>
        ${rankCell(r.rank)}
        <td class="tick-cell"><span class="ticker">${esc(r.t)}</span>`
          + `${r.u ? `<span class="utag" title="Cổ phiếu cơ sở">${esc(r.u)}</span>` : ''}</td>
        ${scoreCell(r.score)}
        <td class="num">${r.coveragePct === null || r.coveragePct === undefined ? '<span class="na">—</span>' : `${num(r.coveragePct, 0)}%`}</td>
        <td class="num">${fmtVnd(r.valueVND)}</td>
        ${changeCellRank(r)}
        ${partCell(r.parts?.liquidity, 'Thanh khoản')}
        ${partCell(r.parts?.cost, 'Chi phí')}
        ${partCell(r.parts?.valuation, 'Định giá')}
        ${partCell(r.parts?.priceQuality, 'Chất lượng giá')}
        ${warnCell(r, sc)}
      </tr>`).join('')}</tbody>
    </table>
  </div>`;
}

function renderScoring() {
  const host = document.querySelector('#view-scoring');
  const sc = analytics?.scoring;
  if (!sc) { host.innerHTML = emptyNotice('xếp hạng'); return; }
  const dist = sc.distribution || {};
  const val = sc.valuation || {};
  const weights = sc.weights || {};

  // Sắp xếp theo lựa chọn hiện tại. Mã chưa chấm một trục (null) bị đẩy xuống cuối ở cả
  // hai chiều — chúng không "thấp", chúng chưa có dữ liệu.

  // Trọng số hiển thị dạng badge thay vì câu văn xuôi — đọc được ngay từng trục nặng bao
  // nhiêu phần trăm mà không phải đọc cả đoạn.
  const weightBadges = Object.keys(WEIGHT_LABELS).map(k => {
    const pctWeight = Math.round((weights[k] || 0) * 100);
    const label = getLang() === 'en' ? WEIGHT_LABELS_EN[k] : WEIGHT_LABELS[k];
    return `<span class="wbadge"><b>${esc(label)}</b><span class="wv">${pctWeight}%</span>`
      + `<span class="wtrack"><span class="wfill" style="width:${pctWeight}%"></span></span></span>`;
  }).join('');

  // Banner gọn thay cho hai tiêu đề + ba đoạn văn dài. Chi tiết gập lại mặc định để bảng
  // lên cao hơn; ai cần thì mở.
  host.innerHTML = `
    <div class="score-banner">
      <div class="sb-row">
        <span class="sb-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/>
            <rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12.5" y="8" width="3" height="10" rx="1"/>
            <rect x="18" y="4" width="3" height="14" rx="1"/></svg>
        </span>
        <div class="sb-main">
          <div class="sb-title">${bi('Điểm CW theo ngày', 'Daily warrant score')}</div>

      detail.hidden = !open;
      toggle.setAttribute('aria-expanded', String(open));
      toggle.textContent = open ? bi('Thu gọn cách tính điểm', 'Hide methodology') : bi('Xem chi tiết cách tính điểm', 'Scoring methodology');

  }

  const resort = () => {
    const host2 = host.querySelector('#scoring-table-host');
    if (host2) host2.innerHTML = scoringTable(scoringRows(sc), sc);   // tính lại theo khoá mới
    bindSort();
    applyI18n(host);
  };
  function bindSort() {
    host.querySelectorAll('th.sortable').forEach(th => {
      const activate = () => {
        const key2 = th.dataset.sort;
        if (scoringSort.key === key2) {
          scoringSort.dir = scoringSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          scoringSort.key = key2;
          scoringSort.dir = SCORING_DEFAULT_DIR[key2] || 'desc';
        }
        resort();
      };
      th.addEventListener('click', activate);
      // Bàn phím: tiêu đề là columnheader có tabindex nên phải bấm được bằng Enter/Space.
      th.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(); }
      });
    });
  }
  bindSort();
}

function glossaryFormula(term, formula, english) {
  if (!formula) return '';
  // English copy of the source formula may vary; use the canonical LaTeX expression by term.
  const latex = GLOSSARY_LATEX[term];
  if (!latex) return '';
  let rendered = '';
  try { rendered = katex.renderToString(latex, { displayMode: true, throwOnError: false, strict: 'ignore' }); }
  catch { rendered = '<span class="formula-fallback">Formula unavailable</span>'; }
  const label = english ? 'Copy LaTeX' : 'Sao chép LaTeX';
  const raw = esc(latex);
  return `<div class="formula-box"><div class="formula-equation" aria-label="${raw}">${rendered}</div><button type="button" class="formula-copy" data-copy-latex="${raw}" aria-label="${label}" title="${label}"><span aria-hidden="true">⧉</span> ${label}</button></div>`;
}

    <section class="notation-panel"><div><span class="panel-kicker">${t.symbols}</span><h3>${english?'Read the notation':'Đọc ký hiệu'}</h3></div><div class="notation-list">${latexSymbolLegend.map(([symbol,meaning])=>`<span><b>${esc(symbol)}</b>${esc(meaning)}</span>`).join('')}</div></section>
    <div class="glossary-controls"><label class="glossary-search"><span aria-hidden="true">⌕</span><input id="glossary-search" type="search" placeholder="${t.search}" autocomplete="off"><kbd>/</kbd></label><div class="glossary-filters" role="group" aria-label="${english?'Filter terms':'Lọc thuật ngữ'}">${filters.map((f,i)=>`<button type="button" class="glossary-filter${i===0?' active':''}" data-glossary-filter="${f.id}" aria-pressed="${i===0}">${esc(f.label)}</button>`).join('')}</div></div>
    <div class="glossary-results" aria-live="polite">${cards}</div><div class="glossary-empty" hidden>${t.empty}</div>`;
  const searchInput = host.querySelector('#glossary-search');
  let activeFilter = 'all';
  const apply = () => {
    const query = searchInput.value.trim().toLowerCase(); let visible = 0;
    host.querySelectorAll('.glossary-card').forEach(card => {
      const show = (activeFilter === 'all' || card.dataset.categories.split(' ').includes(activeFilter)) && card.dataset.search.includes(query);
      card.hidden = !show; if (show) visible++;
    });
    host.querySelectorAll('.glossary-group').forEach(group => { group.hidden = !group.querySelector('.glossary-card:not([hidden])'); });
    host.querySelector('.glossary-empty').hidden = visible > 0;
  };
  searchInput.addEventListener('input', apply);
  host.querySelectorAll('[data-glossary-filter]').forEach(button => button.addEventListener('click', () => {
    activeFilter = button.dataset.glossaryFilter;
    host.querySelectorAll('[data-glossary-filter]').forEach(item => { const selected=item===button; item.classList.toggle('active',selected); item.setAttribute('aria-pressed',String(selected)); });
    apply();
  }));
  host.querySelectorAll('[data-copy-latex]').forEach(button => button.addEventListener('click', async () => {
    const latex = button.dataset.copyLatex;
    try { await navigator.clipboard.writeText(latex); button.classList.add('copied'); button.title=t.done; setTimeout(()=>{button.classList.remove('copied');button.title=t.copy;},1400); }
    catch { const area=document.createElement('textarea'); area.value=latex; area.style.position='fixed'; area.style.opacity='0'; document.body.append(area); area.select(); document.execCommand('copy'); area.remove(); button.classList.add('copied'); }
  }));
  searchInput.addEventListener('keydown', event => { if (event.key === 'Escape') { searchInput.value=''; apply(); } });
}

function updateTabAddress(view, replace = false) {
  const target = urlForView(window.location.href, view);
  const current = `${window.location.pathname}${window.location.search}${window.location.hash}`;
  if (target === current) return;
  const method = replace ? 'replaceState' : 'pushState';
  window.history[method]({tab: VIEW_SLUGS[view]}, '', target);
}

let currentView = viewFromSearch(window.location.search);
// Canonicalize unknown/default slugs without adding an extra browser-history entry.
updateTabAddress(currentView, true);
onLangChange(() => { if (currentView === 'glossary') renderGlossary(); });
document.addEventListener('keydown', event => {
  const target = event.target;
  const isEditing = target instanceof HTMLElement && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
  if (currentView === 'glossary' && event.key === '/' && !isEditing) {
    event.preventDefault();
    document.querySelector('#glossary-search')?.focus();
  }
});

function setView(name) {
  currentView = name;
  // Chọn theo [data-view], không theo .tab: hai nút phụ (Lịch sử, Thuật ngữ) cố ý không
  // mang class .tab — chúng là nút viền, không phải tab — nhưng vẫn phải sáng lên khi mở.
  document.querySelectorAll('#tabs [data-view], .controls [data-view]').forEach(tab => {
    const on = tab.dataset.view === name;
    tab.classList.toggle('active', on);
    if (tab.classList.contains('top-action')) tab.setAttribute('aria-pressed', String(on));
    else tab.setAttribute('aria-selected', String(on));
  });
  for (const view of ['board', 'scoring', 'valuation', 'liquidity', 'underlyings', 'stale', 'intraday', 'band', 'history', 'glossary']) {
    const node = document.querySelector(`#view-${view}`);
    if (node) node.hidden = view !== name;
  }
  const activeView = document.querySelector(`#view-${name}`);
  if (name !== 'board' && activeView && !activeView.firstElementChild) {
    activeView.innerHTML = `<div class="empty" role="status">${bi('Đang tải dữ liệu…','Loading data…')}</div>`;
  }
  // Trang thuật ngữ dựng bằng JS nên chỉ sinh khi mở tới — không tốn công lúc tải trang.
  if (name === 'glossary') renderGlossary();
}

function navigateToView(name) {
  const view = Object.hasOwn(VIEW_SLUGS, name) ? name : 'board';
  if (view !== currentView) updateTabAddress(view);
  setView(view);
}

document.querySelectorAll('#tabs [data-view], .controls [data-view]').forEach(tab => {
  tab.addEventListener('click', () => navigateToView(tab.dataset.view));
});
window.addEventListener('popstate', () => {
  const view = viewFromSearch(window.location.search);
  updateTabAddress(view, true);
  setView(view);
});

// Delegated controls keep search, sorting, pagination and the detail drawer working after
// each local table repaint.
document.addEventListener('input', event => {
  if (event.target.id !== 'valuation-search') return;
  const input = event.target, start = input.selectionStart;
  valuationTableState.query = input.value;
  valuationTableState.page = 0;
  renderValuationTable(valuationRowsCache);
  const next = document.querySelector('#valuation-search');
  next?.focus();
  if (start !== null) next?.setSelectionRange(start, start);
});
document.addEventListener('click', event => {
  const boardHeader = event.target.closest('button[data-board-sort]');
  if (boardHeader) {
    const key = boardHeader.dataset.boardSort;
    if (boardSort.key === key) boardSort.direction = boardSort.direction === 'desc' ? 'asc' : 'desc';
    else { boardSort.key = key; boardSort.direction = 'desc'; }
    render();
    return;
  }
  const sort = event.target.closest('[data-val-sort]');
  if (sort) {
    const key = sort.dataset.valSort;
    valuationTableState.dir = valuationTableState.sort === key && valuationTableState.dir === 'asc' ? 'desc' : 'asc';
    valuationTableState.sort = key;
    valuationTableState.page = 0;
    renderValuationTable(valuationRowsCache);
    return;
  }
  const page = event.target.closest('[data-val-page]');
  if (page) {
    valuationTableState.page += page.dataset.valPage === 'next' ? 1 : -1;
    renderValuationTable(valuationRowsCache);
  }
});

async function loadOptional(key, url) {
  try {
    const response = await fetch(`${url}?v=${Date.now()}`, {cache:'no-store'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } catch (error) {
    return null;
  }
}

// Giao diện chạy trước khi tải dữ liệu: tránh nháy sai màu và để đồng hồ chạy ngay.
initTheme();
startClock({ lang: getLang });
initI18n();
setView(currentView);
document.documentElement.removeAttribute('data-boot-tab');
renderFooter();

// Nạp chi tiết từng mã (tuỳ chọn): thiếu file thì bảng vẫn đầy đủ, chỉ mất phần chi tiết.
let details = null;
try {
  const response = await fetch(`${DETAILS_URL}?v=${Date.now()}`, {cache:'no-store'});
  if (response.ok) details = await response.json();
} catch { details = null; }
indexDetails();
// Overview cần `details` để đếm ITM/ATM/OTM — vẽ lại sau khi file này nạp xong.
if (snapshot) renderOverview();
initDetail(details);

// Bấm mã ở bất kỳ bảng nào có data-ticker đều mở ngăn kéo chi tiết.
document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-ticker]');
  if (!target) return;
  event.preventDefault();
  openDetail(target.dataset.ticker);
});

await loadAnalysis();
indexAnalysis();
renderStats();
renderOverview();
try {
  const response = await fetch(`${SNAPSHOT_URL}?v=${Date.now()}`, {cache:'no-store'});
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  snapshot = await response.json();
  if(snapshot.schemaVersion !== 1 || !Array.isArray(snapshot.rows)) throw new Error('Sai schema snapshot');
  renderFreshness();
  fillFilters();
  document.querySelector('#search').addEventListener('input',render);
  // Mọi bộ lọc đều gọi lại `render()` — không giữ trạng thái song song để khỏi lệch nhau.
  for (const id of ['#f-underlying', '#f-moneyness', '#f-maturity', '#f-issuer']) {
    document.querySelector(id)?.addEventListener('change', render);
  }
  document.querySelector('#f-reset')?.addEventListener('click', () => {
    document.querySelector('#search').value = '';
    for (const id of ['#f-underlying', '#f-moneyness', '#f-maturity', '#f-issuer']) {
      const el = document.querySelector(id);
      if (el) el.value = '';
    }
    render();
  });
  document.querySelector('#download').addEventListener('click',()=>{
    const blob = new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cw-snapshot.json';a.click();URL.revokeObjectURL(a.href);
  });
  render();
} catch(error) {
  document.querySelector('#stamp').textContent='Snapshot chưa có';
  document.querySelector('#rows').innerHTML=`<tr><td colspan="22" id="state">Không tải được snapshot: ${esc(error.message)}. Workflow cần lấy thành công trước khi Pages có dữ liệu.</td></tr>`;
}

[analytics, sessions] = await Promise.all([
  loadOptional('analytics', ANALYTICS_URL),
  loadOptional('sessions', SESSIONS_URL),
]);
// Vẽ lại dòng thời gian: mã phiên nằm trong sessions, mà lúc này mới tải xong.
renderFreshness();
renderScoring();
renderValuation();
renderLiquidity();
renderUnderlyings();
renderStale();
renderIntraday();
renderBand();
renderHistory();
// The current URL view was selected before data loading; no URL write or reload is needed here.

// Nội dung các view do JS sinh nên phải dịch lại sau khi render, và vẽ lại khi đổi ngôn ngữ.
renderFreshness();
renderOverview();
applyI18n(document.body);
window.addEventListener('cwintel:lang', () => {
  renderStats();
  renderOverview();
  if (snapshot) render();
  renderScoring();
  renderValuation();
  renderLiquidity();
  renderUnderlyings();
  renderStale();
  renderIntraday();
  renderBand();
  renderHistory();
  renderFreshness();
  renderFooter();
  setView(currentView);      // giữ nguyên tab đang mở sau khi vẽ lại
});

// Vẽ lại giờ cập nhật mỗi phút để nhãn không bị cũ khi tab mở lâu. Không còn độ trễ để tính.
setInterval(renderFreshness, 60000);
</script>
</body>
</html>
