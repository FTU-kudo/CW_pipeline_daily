name: CW Intelligence — build & publish

on:
  workflow_dispatch:
  # Nối trực tiếp vào pipeline nguồn: build chỉ được chạy khi ingest vừa xong,
  # thay vì chờ cron riêng (cron riêng từng chạy trước khi có dữ liệu phiên mới).
  workflow_run:
    workflows: ["CW Pipeline Daily"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "cwintel/**"
      - "docs/assets/**"
      - "docs/index.html"
      - "tests/**"
      - "output/cache/**"
      - ".github/workflows/cw_intelligence.yml"
  # Cron dự phòng: nếu workflow_run không kích hoạt (repo chưa có dữ liệu mới,
  # hoặc ingest bị bỏ qua), vẫn có một lần build sau giờ ingest 17:30 ICT.
  schedule:
    - cron: "30 10 * * 1-5"   # 17:30 ICT, T2–T6

permissions:
  contents: write

concurrency:
  group: cw-intelligence
  cancel-in-progress: false

jobs:
  build:
    # ingest lỗi thì không build lại trên cache cũ
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir pandas numpy pyarrow openpyxl pytest pytz

      # Build trước: test độ mới phải đọc artifact vừa tạo từ cache mới nhất,
      # không phải docs/data cũ trong checkout (lỗi asof 04/11 khi cache đã có 05/11).
      - name: Build artifacts
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: python -m cwintel.build

      - name: Run test suite
        run: pytest -q

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: cw-data-${{ github.run_id }}
          path: docs/data
          retention-days: 14
          compression-level: 6

      - name: Báo cáo độ mới dữ liệu (phiên)
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("docs/data/meta.json", encoding="utf-8"))
          s = m.get("session") or {}
          lag = s.get("lagSessions", 0)
          print("### Độ mới dữ liệu")
          print(f"- asof: **{m.get('asofLabel')}** · phiên đã đóng gần nhất: **{s.get('expectedLabel')}**")
          print(f"- lệch: **{lag} phiên** · trạng thái: `{s.get('status')}`")
          if lag:
              print(f"- thiếu: {', '.join(s.get('missingLabels') or [])}")
          print()
          PY
          python - <<'PY'
          import json, os
          m = json.load(open("docs/data/meta.json", encoding="utf-8"))
          lag = (m.get("session") or {}).get("lagSessions", 0)
          exp = (m.get("session") or {}).get("expectedLabel")
          if lag:
              print(f"::warning title=Dữ liệu chậm phiên::asof {m.get('asofLabel')} "
                    f"lệch {lag} phiên so với {exp}")
          else:
              print(f"Dữ liệu đã tới phiên {m.get('asofLabel')}.")
          PY

      - name: Commit published data
        run: |
          git config user.name "cw-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu — bỏ qua commit."
            exit 0
          fi
          ASOF=$(python -c "import json;print(json.load(open('docs/data/meta.json'))['asofLabel'])")
          git commit -m "data: cập nhật artifact CW Intelligence (phiên ${ASOF})"
          git push origin HEAD:${GITHUB_REF_NAME}
