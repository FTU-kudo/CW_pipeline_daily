name: CW Pipeline — offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Run tests (offline fixtures only)
        run: pytest -q
