name: CW Yuanta EW snapshot — publish

on:
  workflow_dispatch:
  schedule:
    # 17:30 ICT on weekdays, after the regular trading session.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: yuanta-ew-snapshot
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fetch and analysis dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-core.txt

      # Không chặn pipeline nếu wheel không cài được: client tự lùi về requests.
      - name: Install optional Chrome-fingerprint transport
        run: |
          python -m pip install --disable-pip-version-check "curl_cffi>=0.7" \
            || echo "::warning::Không cài được curl_cffi — sẽ dùng requests (TLS fingerprint khác Chrome)"
          python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)" \
            || echo "curl_cffi không import được; client sẽ dùng requests"

      # WAF/CDN có thể chập chờn với IP datacenter: thử lại ở cấp workflow, có nghỉ.
      - name: Fetch current EW board snapshot from Yuanta
        run: |
          for attempt in 1 2 3; do
            if python scripts/fetch_yuanta_snapshot.py --transport auto; then
              echo "Lấy snapshot thành công ở lần thử $attempt"
              exit 0
            fi
            echo "::warning::Lần thử $attempt thất bại (xem log phía trên để biết HTTP status/body)"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::Không lấy được bảng giá Yuanta sau 3 lần thử"
          exit 1

      # Đọc lại snapshot vừa lấy thay vì gọi API lần hai: workflow chỉ tốn đúng một request.
      - name: Clean, analyse and export the board (CSV + analysis JSON)
        run: |
          python scripts/analyze_yuanta_warrants.py \
            --offline docs/data/yuanta_snapshot.json \
            --csv yuanta_covered_warrants.csv \
            --json docs/data/yuanta_board_analysis.json

      # Ghi bar của phiên vào kho OHLCV (data/cw_history), xuất chuỗi + phân tích.
      # Idempotent: chạy lại trong cùng phiên không tạo thêm dòng.
      - name: Append session bar to the OHLCV history store
        run: |
          python scripts/backfill_yuanta_history.py \
            --offline \
            --sessions-out docs/data/yuanta_sessions.json \
            --analytics-out docs/data/yuanta_analytics.json

      - name: Publish snapshot, analysis and history for GitHub Pages
        run: |
          git config user.name "yuanta-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/data/yuanta_snapshot.json docs/data/yuanta_board_analysis.json
          git add -f docs/data/yuanta_sessions.json docs/data/yuanta_analytics.json
          git add -f data/cw_history/*.csv 2>/dev/null || true
          # CSV là dữ liệu nguồn dẫn xuất: đính kèm vào lần chạy, không commit vào Git.
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; no commit needed."
          else
            git commit -m "data: update Yuanta EW board snapshot, analysis and session history"
            git push origin HEAD:main
          fi

      - name: Upload cleaned CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuanta-covered-warrants-csv
          path: yuanta_covered_warrants.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload OHLCV history store
        uses: actions/upload-artifact@v4
        with:
          name: yuanta-cw-ohlcv-history
          path: data/cw_history/*.csv
          if-no-files-found: warn
          retention-days: 90
