name: CW Pipeline — offline tests only

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-core.txt

      - name: Run offline test suite
        run: pytest -q

      # No provider credentials, market-data ingestion, upload, or data commit runs
      # in GitHub Actions. The private pipeline is run locally by the account owner.
