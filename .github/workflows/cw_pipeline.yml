name: CW Yuanta EW snapshot — publish

on:
  workflow_dispatch:
  schedule:
    # 17:30 ICT on weekdays, after the regular trading session.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: yuanta-ew-snapshot
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch current EW board snapshot from Yuanta
        run: python scripts/fetch_yuanta_snapshot.py

      - name: Publish snapshot for GitHub Pages
        run: |
          git config user.name "yuanta-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/data/yuanta_snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; no commit needed."
            exit 0
          fi
          git commit -m "data: update Yuanta EW board snapshot"
          git push origin HEAD:main
